[advisories]
version = 2
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack timing sidechannel in the pure-Rust `rsa` crate.
    # No upstream fix is available. Pure-Rust PKI requires this crate; we mitigate
    # by using it primarily for signing/verification (deterministic, no
    # attacker-controlled decryption) and document the residual risk for OAEP
    # decryption callers in README.md.
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
